<style>
:root{
  --bg:#f6f2e9;--card:#fffdf9;--text:#26302a;--muted:#7a7f78;--line:#ebe5dc;
  --green:#0d5b58;--green-dark:#024a4a;--green-soft:#e1edea;
  --gold:#d4ae5e;--peach:#fbe9da;--sky:#dfe9f5;--sky-ink:#2f5d8a;
  --warn-bg:#fdf1dc;--warn:#d98a2b;--red:#c2503f;--red-soft:#fbe7e2;
  --shadow:0 2px 6px rgba(80,60,30,.05),0 10px 28px rgba(80,60,30,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:16px;line-height:1.5}
button{font-family:inherit}
.wrap{max-width:520px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
.view{display:none;animation:fade .25s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Home ---------- */
.hero{border-radius:28px;padding:18px 22px 28px;box-shadow:0 14px 34px rgba(2,74,74,.28);
  background:radial-gradient(120% 80% at 50% 0%,#0a5f5c 0%,#024a4a 60%,#013c3c 100%);position:relative;overflow:hidden;color:#f7efd9}
.hero::before{content:"";position:absolute;inset:8px;border:1.5px solid rgba(212,174,94,.55);border-radius:22px;pointer-events:none}
.flag-img{display:block;width:100%;border-radius:14px;margin:14px 0 4px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.emblem{position:absolute;right:0;top:0;width:58px;height:58px;border-radius:16px;object-fit:cover;box-shadow:var(--shadow)}
#v-trip{position:relative}
.muz{display:block;width:62%;margin:28px auto 0;border-radius:16px;box-shadow:var(--shadow)}
.badge{position:relative;display:inline-flex;align-items:center;gap:6px;background:rgba(212,174,94,.18);color:var(--gold);border:1px solid rgba(212,174,94,.5);
  font-size:13px;font-weight:700;padding:5px 12px;border-radius:999px;letter-spacing:.5px}
.hero svg.art{display:block;width:100%;max-width:320px;margin:4px auto 0}
.brand{font-size:52px;font-weight:900;color:var(--green-dark);margin:6px 0 0;letter-spacing:4px;line-height:1.1}
.brand-sub{color:var(--gold);text-align:center;font-weight:700;letter-spacing:6px;font-size:15px;margin-top:4px}
.tagline{font-size:20px;font-weight:900;margin:20px 0 0;display:inline-block;color:#fbf5e4}
.tagline::after{content:"";display:block;height:6px;border-radius:6px;background:var(--gold);margin-top:6px}
.desc{color:rgba(247,239,217,.78);margin:14px 0 22px;font-size:15px}
.cta{position:relative;display:inline-flex;align-items:center;gap:10px;background:var(--gold);color:#01393a;border:none;
  font-size:18px;font-weight:700;padding:14px 26px;border-radius:16px;cursor:pointer;
  box-shadow:0 8px 18px rgba(0,0,0,.25)}
.cta:active{transform:scale(.98)}

.sec-title{font-size:19px;font-weight:900;margin:30px 4px 14px}
.trip-card{display:block;width:100%;text-align:left;border:none;cursor:pointer;border-radius:22px;padding:20px;
  background:var(--sky);box-shadow:var(--shadow);color:var(--text);position:relative;overflow:hidden}
.trip-card .row{display:flex;align-items:center;gap:14px}
.trip-card .flag{width:56px;height:56px;border-radius:16px;background:#fff;display:grid;place-items:center;font-size:30px;flex:none}
.trip-card h3{margin:0;font-size:21px;font-weight:900}
.trip-card .meta{color:var(--sky-ink);font-size:14px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{background:rgba(255,255,255,.75);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:500;color:var(--sky-ink)}
.trip-card .go{position:absolute;right:18px;top:26px;color:var(--sky-ink)}
.mini-bar{height:8px;border-radius:9px;background:rgba(255,255,255,.7);margin-top:16px;overflow:hidden}
.mini-bar i{display:block;height:100%;background:var(--sky-ink);border-radius:9px;transition:width .3s}
.mini-txt{font-size:13px;color:var(--sky-ink);margin-top:6px;font-weight:700}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}

/* ---------- Common ---------- */
.back{border:none;background:none;padding:6px 6px 6px 0;cursor:pointer;color:var(--text);display:inline-flex}
.page-title{font-size:30px;font-weight:900;margin:8px 0 2px}
.page-meta{color:var(--muted);font-size:15px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.date-btn{border:none;background:none;color:var(--muted);font-size:15px;padding:0;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;position:relative}
.date-btn input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.countdown{background:var(--green-soft);color:var(--green-dark);font-weight:700;font-size:13px;padding:2px 10px;border-radius:999px}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:20px}
.total{margin-top:20px}
.total .nums{display:flex;justify-content:space-between;align-items:baseline}
.total .big{font-size:34px;font-weight:900;color:var(--green)}
.total .of{font-size:18px;font-weight:700}
.total .pct{font-size:15px;color:var(--muted);font-weight:700}
.total .pct b{color:var(--green);font-size:24px;font-weight:900}
.bar{height:10px;border-radius:10px;background:var(--line);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;width:0;background:var(--green);border-radius:10px;transition:width .35s}

.group{display:flex;align-items:center;gap:16px;width:100%;text-align:left;border:none;cursor:pointer;margin-bottom:14px;
  background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:18px;color:var(--text)}
.group:active{transform:scale(.99)}
.group .ic{width:68px;height:68px;border-radius:18px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;flex:none}
.group .txt{flex:1;min-width:0}
.group h3{margin:0;font-size:20px;font-weight:900}
.group p{margin:2px 0 0;color:var(--muted);font-size:14px}
.group .bar{height:7px;margin-top:10px}
.group .cnt{font-size:14px;font-weight:700;color:var(--muted);margin-top:6px}
.group .cnt.full{color:var(--green)}
.group.must{background:var(--red-soft)}
.group.must .ic{background:#fff;color:var(--red)}
.group.must h3{color:var(--red)}
.group.must .bar i{background:var(--red)}
.chev-r{color:var(--muted);flex:none}

.tip{display:flex;gap:12px;background:var(--warn-bg);border-radius:18px;padding:16px;margin-top:6px;font-size:15px;color:#5b4a33}
.tip svg{color:var(--warn);flex:none;margin-top:1px}
.tip + .tip{margin-top:10px}
.tip.blue{background:var(--sky);color:#2b4560}
.tip.blue svg{color:var(--sky-ink)}
.tip b{font-weight:700}
.outline-btn{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;margin-top:22px;padding:15px;
  border:2px solid var(--green);color:var(--green-dark);background:transparent;border-radius:18px;font-size:18px;font-weight:900;cursor:pointer}

/* ---------- List page ---------- */
.list-head{display:flex;align-items:center;justify-content:space-between}
.pill{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;cursor:pointer}
.pill.on{background:var(--green);border-color:var(--green);color:#fff}
.section{margin-top:18px}
.section h4{margin:0 4px 8px;font-size:15px;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.items{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;align-items:center;padding:0 14px;min-height:54px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item label{flex:1;display:flex;align-items:center;gap:13px;padding:13px 0;cursor:pointer}
.item input{appearance:none;-webkit-appearance:none;width:26px;height:26px;border:2px solid #d8d1c5;border-radius:9px;margin:0;flex:none;
  display:grid;place-items:center;background:#fff;transition:.15s}
.item input:checked{background:var(--green);border-color:var(--green)}
.item input:checked::after{content:"";width:6px;height:12px;border:solid #fff;border-width:0 2.6px 2.6px 0;transform:rotate(45deg) translate(-1px,-1px)}
.item .nm{flex:1}
.item .note{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.item input:checked ~ .nm{color:var(--muted);text-decoration:line-through}
.del{display:none;border:none;background:none;color:var(--red);font-size:24px;line-height:1;padding:6px 4px 6px 10px;cursor:pointer}
.editing .del{display:block}
.sec-del{display:none;border:none;background:none;color:var(--red);font-size:13px;font-weight:700;cursor:pointer}
.editing .sec-del{display:block}
.add{display:flex;gap:8px;padding:10px 12px;background:#faf6ef}
.add input,.newsec input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;background:#fff;color:var(--text);outline:none;font-family:inherit}
.add input:focus,.newsec input:focus{border-color:var(--green)}
.add button,.newsec button{border:none;background:var(--green-soft);color:var(--green-dark);font-weight:700;border-radius:12px;padding:0 14px;font-size:15px;cursor:pointer}
.newsec{display:none;gap:8px;margin-top:18px}
.editing .newsec{display:flex}
.list-actions{display:flex;gap:8px;margin-top:22px}
.list-actions .pill{flex:1;padding:11px}
.must-view .items{border:2px solid var(--red)}
.must-view .item .nm{font-weight:700}
.item .note{font-weight:400}

/* ---------- Check page ---------- */
.done-box{text-align:center;padding:36px 20px}
.done-box .em{font-size:56px}
.done-box h3{font-size:22px;margin:10px 0 4px;font-weight:900;color:var(--green-dark)}
.miss-group{margin-top:18px}

  <form class="newsec" id="newSec"><input placeholder="新增分類名稱" maxlength="20"><button type="submit">＋分類</button></form>
  <div class="list-actions">
    <button class="pill" id="hideBtn">隱藏已打包</button>
    <button class="pill" id="resetBtn">取消全部勾選</button>
  </div>
</section>

<!-- ================= CHECK ================= -->
<section class="view" id="v-check">
  <button class="back" data-go="trip" aria-label="返回"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="page-title">檢查完成進度</div>
  <div class="page-meta">還沒打包的東西都列在這裡，可以直接勾。</div>
  <div id="checkBody"></div>
  <button class="outline-btn" id="restoreBtn" style="border-color:var(--line);color:var(--muted);font-size:15px;font-weight:700">還原成預設清單</button>
</section>

</div>

<script>
const KEY = 'muzi-mel-packing-v1';
const ICONS = {
  must:'<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="11" r="2.2"/><path d="M5.8 16c.6-1.5 1.8-2.2 3.2-2.2s2.6.7 3.2 2.2M14.5 10h4M14.5 13.5h3"/></svg>',
  carry:'<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7V5.5a4 4 0 018 0V7"/><rect x="5" y="7" width="14" height="14" rx="3.5"/><path d="M8.5 14h7v7h-7z"/></svg>',
  check:'<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="12" rx="2.5"/><path d="M9 7V4.5h6V7M9 7v12M15 7v12M8 21.5h.01M16 21.5h.01"/></svg>'
};
const chevR = '<svg class="chev-r" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

// 項目格式：'名稱' 或 '名稱|小提醒'
const DEFAULTS = {
  must: { title:'必帶證件', desc:'沒有它們就出不了門，一定要再三確認', sub:'⚠️ 很重要，出門前務必再檢查一次', sections:[
    ['必帶證件', ['護照|效期需 6 個月以上','國際駕照|自駕大洋路必備','台灣駕照|須與國際駕照一起出示']]
  ]},
  carry: { title:'隨身行李', desc:'登機時帶在身上的重要物品', sub:'登機時帶在身上的重要物品', sections:[
    ['文件', ['澳洲 ETA 電子簽證|確認已核准，與護照綁定','電子機票 / 登機證','住宿訂房確認','租車預約確認單','旅遊不便險 / 海外醫療險','證件影本與電子檔|與正本分開放']],
    ['錢', ['信用卡|建議帶 2 張不同發卡組織','澳幣現金','少量台幣|回程交通用']],
    ['電子產品', ['手機','行動電源|只能隨身，不可托運','充電線','耳機','網卡 / eSIM','相機與記憶卡']],
    ['機上好物', ['薄外套 / 圍巾|機上冷氣強','頸枕','眼罩與耳塞','空水瓶|過安檢後再裝水','原子筆|填入境卡用']],
    ['藥品', ['個人處方藥|附英文藥名或處方說明','暈機藥']]
  ]},
  check: { title:'托運行李', desc:'放進行李箱、交給航空公司的物品', sub:'放進行李箱、交給航空公司的物品', sections:[
    ['衣物', ['短袖上衣','長袖上衣','保暖 / 防風外套|墨爾本一天四季，洋蔥式穿搭','長褲','內衣褲','襪子','睡衣','好走的鞋子|淘金小鎮、大洋路步道','拖鞋','帽子','圍巾']],
    ['盥洗保養', ['牙刷牙膏','洗面乳','洗髮精 / 沐浴乳','保養品','防曬乳|澳洲紫外線非常強','護唇膏','刮鬍刀','隱形眼鏡與藥水']],
    ['電器', ['澳洲轉接頭|八字型 Type I，電壓 230V','多孔 USB 充電器','小型延長線']],
    ['常備藥', ['感冒藥','腸胃藥','止痛藥','OK 繃','蚊蟲藥膏']],
    ['其他', ['太陽眼鏡','折疊傘','環保購物袋','收納袋 / 壓縮袋','髒衣袋','曬衣夾 / 衣架']]
  ]}
};
const ORDER = ['must','carry','check'];

let seq = Date.now();
const nid = () => (seq++).toString(36);
function fresh(){
  const g = {};
  for (const k of ORDER) g[k] = { sections: DEFAULTS[k].sections.map(([name, items]) => ({ id:nid(), name,
    items: items.map(s => { const [n, note] = s.split('|'); return { id:nid(), name:n, note:note||'', done:false }; }) })) };
  return { date:'', groups:g };
}

let state; try { state = JSON.parse(localStorage.getItem(KEY)); } catch(e){}
if (!state || !state.groups) state = fresh();
let hide = false; try { hide = localStorage.getItem(KEY+'-hide') === '1'; } catch(e){}
let editing = false, curGroup = 'carry';
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
const items = k => state.groups[k].sections.flatMap(s => s.items);
const stat = arr => { const d = arr.filter(i => i.done).length; return { d, n:arr.length, p: arr.length ? Math.round(d/arr.length*100) : 0 }; };

/* ---------- routing ---------- */
function go(view, group){
  if (group) curGroup = group;
  editing = false;
  location.hash = view === 'list' ? 'list/' + curGroup : view;
}
function route(){
  const h = location.hash.replace('#','') || 'home';
  const [view, g] = h.split('/');
  if (view === 'list' && state.groups[g]) curGroup = g;
  const v = ['home','trip','list','check'].includes(view) ? view : 'home';
  document.querySelectorAll('.view').forEach(el => el.classList.toggle('active', el.id === 'v-' + v));
  window.scrollTo(0,0);
  render();
}
window.addEventListener('hashchange', route);
document.addEventListener('click', e => {
  const b = e.target.closest('[data-go]');
  if (b) go(b.dataset.go, b.dataset.group);
});

/* ---------- render ---------- */
function render(){
  const all = ORDER.flatMap(items), t = stat(all);
  // home
  $('homeBar').style.width = t.p + '%';
  $('homeTxt').textContent = `${t.d} / ${t.n} 項完成`;
  // date
  if (state.date){
    const [y,m,d] = state.date.split('-');
    $('dateLabel').firstChild.textContent = `出發 ${y}/${m}/${d}`;
    const days = Math.ceil((new Date(+y, m-1, +d) - new Date(new Date().toDateString())) / 864e5);
    const cd = $('countdown');
    cd.hidden = false;
    cd.textContent = days > 0 ? `倒數 ${days} 天` : days === 0 ? '今天出發！' : '旅途中 ✈️';
    $('homeMeta').textContent = `國外旅遊・12 天・${m}/${d} 出發`;
  }
  $('dateInput').value = state.date || '';
  // trip
  $('tDone').textContent = t.d; $('tAll').textContent = t.n; $('tPct').textContent = t.p + '%'; $('tBar').style.width = t.p + '%';
  $('groupCards').innerHTML = ORDER.map(k => {
    const s = stat(items(k)), full = s.n && s.d === s.n;
    return `<button class="group ${k==='must'?'must':''}" data-go="list" data-group="${k}">
      <div class="ic">${ICONS[k]}</div>
      <div class="txt"><h3>${DEFAULTS[k].title}</h3><p>${DEFAULTS[k].desc}</p>
        <div class="bar"><i style="width:${s.p}%"></i></div>
        <div class="cnt ${full?'full':''}">${full?'✓ ':''}${s.d} / ${s.n} 項</div></div>${chevR}</button>`;
  }).join('');
  renderList();
  renderCheck();
}

function itemRow(it, secId){
  return `<div class="item" data-sec="${secId}" data-item="${it.id}" ${hide && it.done ? 'hidden' : ''}>
    <label><input type="checkbox" ${it.done?'checked':''}><span class="nm">${esc(it.name)}${it.note?`<span class="note">${esc(it.note)}</span>`:''}</span></label>
    <button class="del" aria-label="刪除">×</button></div>`;
}

function renderList(){
  const k = curGroup, g = state.groups[k], s = stat(items(k));
  const v = $('v-list');
  v.classList.toggle('editing', editing);
  v.classList.toggle('must-view', k === 'must');
  $('lTitle').textContent = DEFAULTS[k].title;
  $('lSub').textContent = DEFAULTS[k].sub;
  $('lDone').textContent = s.d; $('lAll').textContent = s.n; $('lPct').textContent = s.p + '%'; $('lBar').style.width = s.p + '%';
  $('lBar').style.background = k === 'must' ? 'var(--red)' : '';
  $('editBtn').textContent = editing ? '完成' : '編輯';
  $('editBtn').classList.toggle('on', editing);
  $('hideBtn').classList.toggle('on', hide);
  $('sections').innerHTML = g.sections.map(sec => {
    const ss = stat(sec.items);
    return `<div class="section" data-sec="${sec.id}">
      <h4><span>${esc(sec.name)}　${ss.d}/${ss.n}</span><button class="sec-del">刪除分類</button></h4>
      <div class="items">${sec.items.map(it => itemRow(it, sec.id)).join('')}
        <form class="add"><input placeholder="新增項目…" maxlength="40" enterkeyhint="done"><button type="submit">新增</button></form>
      </div></div>`;
  }).join('');
}

function renderCheck(){
  const miss = ORDER.map(k => ({ k, list: state.groups[k].sections.flatMap(sec => sec.items.filter(i => !i.done).map(i => ({i, sec:sec.id}))) }))
    .filter(x => x.list.length);
  if (!miss.length){
    $('checkBody').innerHTML = `<div class="card done-box" style="margin-top:20px"><div class="em">🎉</div><h3>全部打包完成！</h3><div class="page-meta" style="justify-content:center">木子團，墨爾本見 ✈️🦘</div></div>`;
    return;
  }
  $('checkBody').innerHTML = miss.map(x => `<div class="miss-group ${x.k==='must'?'must':''}">
    <h4>${x.k==='must'?'⚠️ ':''}${DEFAULTS[x.k].title}<span>還差 ${x.list.length} 項</span></h4>
    <div class="items" ${x.k==='must'?'style="border:2px solid var(--red)"':''} data-group="${x.k}">${x.list.map(({i,sec}) => itemRow(i, sec)).join('')}</div></div>`).join('');
}

/* ---------- events ---------- */
function findItem(el){
  const row = el.closest('[data-item]');
  const gk = el.closest('[data-group]')?.dataset.group || curGroup;
  const sec = state.groups[gk].sections.find(s => s.id === row.dataset.sec);
  return { sec, it: sec.items.find(i => i.id === row.dataset.item) };
}
document.addEventListener('change', e => {
  if (e.target.matches('.item input[type=checkbox]')){
    const { it } = findItem(e.target);
    it.done = e.target.checked; save();
    setTimeout(render, e.target.closest('#v-check') ? 250 : 0);
  }
});
$('v-list').addEventListener('click', e => {
  if (e.target.matches('.del')){
    const { sec, it } = findItem(e.target);
    sec.items = sec.items.filter(i => i !== it); save(); render();
  } else if (e.target.matches('.sec-del')){
    const id = e.target.closest('[data-sec]').dataset.sec, g = state.groups[curGroup];
    const sec = g.sections.find(s => s.id === id);
    if (confirm(`刪除「${sec.name}」整個分類？`)){ g.sections = g.sections.filter(s => s !== sec); save(); render(); }
  }
});
$('sections').addEventListener('submit', e => {
  e.preventDefault();
  const inp = e.target.querySelector('input'), name = inp.value.trim();
  if (!name) return;
  const id = e.target.closest('[data-sec]').dataset.sec;
  state.groups[curGroup].sections.find(s => s.id === id).items.push({ id:nid(), name, note:'', done:false });
  save(); render();
  document.querySelector(`#sections [data-sec="${id}"] .add input`)?.focus();
});
$('newSec').addEventListener('submit', e => {
  e.preventDefault();
  const inp = e.target.querySelector('input'), name = inp.value.trim();
  if (!name) return;
  state.groups[curGroup].sections.push({ id:nid(), name, items:[] });
  inp.value = ''; save(); render();
});
$('editBtn').onclick = () => { editing = !editing; renderList(); };
$('hideBtn').onclick = () => { hide = !hide; try { localStorage.setItem(KEY+'-hide', hide?'1':'0'); } catch(e){} renderList(); };
$('resetBtn').onclick = () => {
  if (!confirm(`把「${DEFAULTS[curGroup].title}」全部取消勾選？`)) return;
  items(curGroup).forEach(i => i.done = false); save(); render();
};
$('restoreBtn').onclick = () => {
  if (!confirm('還原成預設清單？你新增、刪除的項目和勾選紀錄都會重設。')) return;
  const date = state.date; state = fresh(); state.date = date; save(); render();
};
$('dateInput').addEventListener('change', e => { state.date = e.target.value; save(); render(); });

route();
</script>
</body>
</html>
